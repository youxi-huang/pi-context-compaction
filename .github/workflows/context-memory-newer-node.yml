name: Context compaction on newer Node

# Node 22 runs the full pipeline in context-memory.yml and is the only Node a
# release is verified on. This workflow runs the same build and acceptance checks
# on newer Node majors to find breakage early. It stays in its own file because
# publication requires the whole context-memory.yml run on main to succeed, and a
# newer Node must neither block nor approve a release.

on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'docs/**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['*.md', 'docs/**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-memory-newer-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-newer-node:
    name: verify on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    env:
      PI_OFFLINE: '1'
      EVAL_PROVIDER_MODE: scripted
      EVAL_MODEL_CALL_BUDGET: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The offline gate compares runtime files with the pinned evaluation commit.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node scripts/context-memory-ops.mjs verify --verbose
