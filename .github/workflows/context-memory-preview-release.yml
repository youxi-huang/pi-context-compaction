name: Publish extension preview

on:
  push:
    tags: ['v*']
    branches: ['release/publish-v*']
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing immutable source tag to publish
        required: true
        type: string

permissions:
  contents: write
  actions: read
  checks: read

concurrency:
  group: context-memory-preview-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Select source tag and preserve reviewed publication tooling
        id: source
        env:
          PI_CONTEXT_TRIGGER_REF: ${{ github.ref_name }}
          PI_CONTEXT_REQUESTED_TAG: ${{ inputs.source_tag }}
        run: |
          selected_tag="$(node --input-type=module <<'NODE'
          import { selectReviewedSourceTag } from "./scripts/context-memory-preview-release-checks.mjs";
          process.stdout.write(selectReviewedSourceTag({ requestedTag: process.env.PI_CONTEXT_REQUESTED_TAG, triggerRef: process.env.PI_CONTEXT_TRIGGER_REF }));
          NODE
          )"
          git fetch origin main
          tooling_commit="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$tooling_commit" origin/main
          mkdir -p "$RUNNER_TEMP/context-preview-publisher/scripts" "$RUNNER_TEMP/context-preview-publisher/eval"
          cp scripts/context-memory-preview-release.mjs scripts/context-memory-preview-release-checks.mjs scripts/context-memory-preview-acceptance-profile.mjs scripts/context-memory-preview-stock-install.mjs "$RUNNER_TEMP/context-preview-publisher/scripts/"
          cp eval/deny-network.mjs "$RUNNER_TEMP/context-preview-publisher/eval/"
          printf 'source_tag=%s\n' "$selected_tag" >> "$GITHUB_OUTPUT"
          printf 'tooling_commit=%s\n' "$tooling_commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ steps.source.outputs.source_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/context-memory-preview-build.mjs
      - name: Plan publication from the candidate's own metadata
        id: plan
        run: node "$RUNNER_TEMP/context-preview-publisher/scripts/context-memory-preview-release-checks.mjs" --plan .artifacts/context-memory-preview-package >> "$GITHUB_OUTPUT"
      - name: Install every official Pi host the candidate declares
        env:
          PLAN_HOSTS: ${{ steps.plan.outputs.hosts }}
        run: |
          for host in $PLAN_HOSTS; do
            node "$RUNNER_TEMP/context-preview-publisher/scripts/context-memory-preview-stock-install.mjs" --stock-root "$RUNNER_TEMP/context-preview-pi-$host" --version "$host"
          done
      - name: Verify the release package on stock Pi
        env:
          PLAN_HOSTS: ${{ steps.plan.outputs.hosts }}
        run: |
          read -r -a hosts <<< "$PLAN_HOSTS"
          compatibility_args=()
          for host in "${hosts[@]:1}"; do
            compatibility_args+=(--compatible-stock-root "$RUNNER_TEMP/context-preview-pi-$host")
          done
          node scripts/context-memory-preview-acceptance.mjs --package-dir .artifacts/context-memory-preview-package --stock-root "$RUNNER_TEMP/context-preview-pi-${hosts[0]}" --output-dir .artifacts/context-memory-preview-acceptance "${compatibility_args[@]}"
          for host in "${hosts[@]:1}"; do
            node scripts/context-memory-preview-acceptance.mjs --package-dir .artifacts/context-memory-preview-package --stock-root "$RUNNER_TEMP/context-preview-pi-$host" --output-dir ".artifacts/context-memory-preview-acceptance-$host"
          done
      - name: Verify final release scenarios
        env:
          PLAN_HOSTS: ${{ steps.plan.outputs.hosts }}
          PLAN_PROFILE: ${{ steps.plan.outputs.profile }}
          PLAN_OTHER: ${{ steps.plan.outputs.other }}
        run: |
          # Releases before scenario acceptance have no profile; every later version requires one.
          if [ -n "$PLAN_PROFILE" ]; then
            read -r -a hosts <<< "$PLAN_HOSTS"
            node "$RUNNER_TEMP/context-preview-publisher/scripts/context-memory-preview-stock-install.mjs" --stock-root "$RUNNER_TEMP/context-preview-other" --version "$PLAN_OTHER"
            node scripts/context-memory-preview-scenarios.mjs --package-dir .artifacts/context-memory-preview-package --stock-root "$RUNNER_TEMP/context-preview-pi-${hosts[0]}" --other-stock-root "$RUNNER_TEMP/context-preview-other" --output-dir .artifacts/context-memory-preview-scenarios --acceptance-profile "$PLAN_PROFILE"
          fi
      - name: Publish checked package and source archives
        env:
          GH_TOKEN: ${{ github.token }}
          PI_CONTEXT_RELEASE_ROOT: ${{ github.workspace }}
          PI_CONTEXT_RELEASE_TAG: ${{ steps.source.outputs.source_tag }}
          PI_CONTEXT_RELEASE_TOOLING_COMMIT: ${{ steps.source.outputs.tooling_commit }}
        run: node "$RUNNER_TEMP/context-preview-publisher/scripts/context-memory-preview-release.mjs" --publish
