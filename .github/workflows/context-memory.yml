name: Context memory

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/context-memory-model-data.mjs
      - run: node scripts/stamp-context-memory.mjs
      - run: git diff --exit-code -- packages/coding-agent/src/extensions/context-memory/build.ts
      - run: npm run build:offline
      - run: node scripts/context-memory-check.mjs
