name: Context compaction

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PI_OFFLINE: '1'
      EVAL_PROVIDER_MODE: scripted
      EVAL_MODEL_CALL_BUDGET: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The offline gate compares runtime files with the pinned evaluation commit.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/context-memory-model-data.mjs
      - run: node scripts/stamp-context-memory.mjs
      - run: git diff --exit-code -- packages/coding-agent/src/extensions/context-memory/build.ts
      - run: npm run build:offline
      - run: node scripts/context-memory-check.mjs
      - run: node scripts/security-regression-check.mjs
      - name: Build independent extension candidate
        run: node scripts/context-memory-preview-build.mjs
      - name: Plan hosts from the candidate's own metadata
        id: plan
        run: node scripts/context-memory-preview-release-checks.mjs --plan .artifacts/context-memory-preview-package >> "$GITHUB_OUTPUT"
      - name: Install every official Pi host the candidate declares
        env:
          PLAN_HOSTS: ${{ steps.plan.outputs.hosts }}
        run: |
          for host in $PLAN_HOSTS; do
            node scripts/context-memory-preview-stock-install.mjs --stock-root "${{ runner.temp }}/context-preview-pi-$host" --version "$host"
          done
      - name: Verify candidate on the primary official Pi with cross-version checkpoints
        env:
          PLAN_HOSTS: ${{ steps.plan.outputs.hosts }}
        run: |
          read -r -a hosts <<< "$PLAN_HOSTS"
          compatibility_args=()
          for host in "${hosts[@]:1}"; do
            compatibility_args+=(--compatible-stock-root "${{ runner.temp }}/context-preview-pi-$host")
          done
          node scripts/context-memory-preview-acceptance.mjs --package-dir .artifacts/context-memory-preview-package --stock-root "${{ runner.temp }}/context-preview-pi-${hosts[0]}" --output-dir .artifacts/context-memory-preview-acceptance "${compatibility_args[@]}"
      - name: Verify the same package on each older supported Pi
        env:
          PLAN_HOSTS: ${{ steps.plan.outputs.hosts }}
        run: |
          read -r -a hosts <<< "$PLAN_HOSTS"
          for host in "${hosts[@]:1}"; do
            node scripts/context-memory-preview-acceptance.mjs --package-dir .artifacts/context-memory-preview-package --stock-root "${{ runner.temp }}/context-preview-pi-$host" --output-dir ".artifacts/context-memory-preview-acceptance-$host"
          done
      - name: Install an unsupported official Pi for scenario checks
        env:
          PLAN_OTHER: ${{ steps.plan.outputs.other }}
        run: node scripts/context-memory-preview-stock-install.mjs --stock-root "${{ runner.temp }}/context-preview-other" --version "$PLAN_OTHER"
      - name: Run full default-settings scenarios with strict acceptance
        env:
          PLAN_HOSTS: ${{ steps.plan.outputs.hosts }}
        run: |
          read -r -a hosts <<< "$PLAN_HOSTS"
          node scripts/context-memory-preview-scenarios.mjs --package-dir .artifacts/context-memory-preview-package --stock-root "${{ runner.temp }}/context-preview-pi-${hosts[0]}" --other-stock-root "${{ runner.temp }}/context-preview-other" --output-dir .artifacts/context-memory-preview-scenarios --acceptance-profile strict
      - name: Prepare release archives without publishing
        run: |
          node --test scripts/context-memory-preview-release-checks.test.mjs
          node scripts/context-memory-preview-release.mjs --prepare
      - name: Verify synthetic evaluation (network blocked, zero model budget)
        env:
          EVAL_ARTIFACT_DIR: ${{ runner.temp }}/context-eval
        run: node eval/check.mjs
