<svg xmlns="http://www.w3.org/2000/svg" width="660" height="958" viewBox="0 0 660 958" role="img" aria-labelledby="cgd-title cgd-desc">
  <title id="cgd-title">How a checkpoint is committed</title>
  <desc id="cgd-desc">A draft handover note, written by the session model or a fixed writer, enters a commit gate with four checks in order. 1, valid note: it parses, matches the note schema and fits its budget. 2, sources on this branch: every cited entry is a readable record on the current branch. 3, exact quotations: every quote occurs character for character in a cited entry. 4, unchanged sources: the records on disk still match the attempt’s source hash. If all four pass, the note is saved by Pi and then read back from disk; only then is the checkpoint committed, and requests continue. If any check fails, or the save or the readback fails, the checkpoint is not committed: requests stay paused across new input, /reload and restarts; no unchecked summary is published; no other writer is substituted. Two commands lead out of that state. /compact retries, and the pause ends only when a new checkpoint is committed. /compaction-recover confirms a checkpoint Pi already saved after it was staged. Footnote: these checks establish reference consistency, not completeness. Sessions SLICE never protected and cannot check are left to Pi.</desc>

  <defs>
    <marker id="arrow-d" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#6E7A8A"/>
    </marker>
    <marker id="arrow-accent-d" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#E0996A"/>
    </marker>
  </defs>

  <rect width="660" height="958" fill="#12161C"/>

  <g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, &quot;Liberation Sans&quot;, sans-serif" letter-spacing="0.01em">

    <!-- header -->
    <text x="40" y="36" font-size="17" font-weight="600" fill="#E8EDF4">How a checkpoint is committed</text>
    <text x="40" y="58" font-size="11.5" fill="#A6B0BE">A note becomes the checkpoint only after every check passes and the saved copy is read back.</text>

    <!-- connectors -->
    <line x1="330" y1="142" x2="330" y2="178" stroke="#6E7A8A" stroke-width="0.9" marker-end="url(#arrow-d)"/>
    <line x1="330" y1="424" x2="330" y2="458" stroke="#6E7A8A" stroke-width="0.9" marker-end="url(#arrow-d)"/>
    <path d="M 264,490 L 180,490 L 180,550" fill="none" stroke="#6E7A8A" stroke-width="0.9" marker-end="url(#arrow-d)"/>
    <line x1="180" y1="596" x2="180" y2="638" stroke="#6E7A8A" stroke-width="0.9" marker-end="url(#arrow-d)"/>
    <path d="M 396,490 L 560,490 L 560,638" fill="none" stroke="#E0996A" stroke-width="1" marker-end="url(#arrow-accent-d)"/>
    <path d="M 320,574 L 460,574 L 460,638" fill="none" stroke="#E0996A" stroke-width="1" marker-end="url(#arrow-accent-d)"/>
    <path d="M 350,778 L 350,846" fill="none" stroke="#6E7A8A" stroke-width="0.9"/>
    <line x1="350" y1="802" x2="368" y2="802" stroke="#6E7A8A" stroke-width="0.9" marker-end="url(#arrow-d)"/>
    <line x1="350" y1="846" x2="368" y2="846" stroke="#6E7A8A" stroke-width="0.9" marker-end="url(#arrow-d)"/>

    <!-- draft note -->
    <rect x="180" y="88" width="300" height="54" rx="3" fill="#232A35" stroke="#6E7A8A" stroke-width="1"/>
    <text x="330" y="112" font-size="13" font-weight="600" fill="#E8EDF4" text-anchor="middle">Draft handover note</text>
    <text x="330" y="130" font-size="11" fill="#A6B0BE" text-anchor="middle">written by the session model, or a fixed writer</text>

    <!-- gate region -->
    <rect x="40" y="180" width="580" height="244" rx="4" fill="none" stroke="#6E7A8A" stroke-width="1"/>
    <rect x="64" y="172" width="94" height="15" fill="#12161C"/>
    <text x="111" y="184" font-size="10.5" font-weight="600" letter-spacing="0.09em" fill="#A6B0BE" text-anchor="middle">COMMIT GATE</text>

    <circle cx="74" cy="212" r="9.5" fill="#1B212B" stroke="#6E7A8A" stroke-width="0.9"/>
    <text x="74" y="216" font-size="10" font-weight="600" fill="#E8EDF4" text-anchor="middle">1</text>
    <text x="96" y="210" font-size="12.5" font-weight="600" fill="#E8EDF4">Valid note</text>
    <text x="96" y="228" font-size="11" fill="#A6B0BE">parses, matches the note schema and fits its budget</text>

    <circle cx="74" cy="268" r="9.5" fill="#1B212B" stroke="#6E7A8A" stroke-width="0.9"/>
    <text x="74" y="272" font-size="10" font-weight="600" fill="#E8EDF4" text-anchor="middle">2</text>
    <text x="96" y="266" font-size="12.5" font-weight="600" fill="#E8EDF4">Sources on this branch</text>
    <text x="96" y="284" font-size="11" fill="#A6B0BE">every cited entry is a readable record on the current branch</text>

    <circle cx="74" cy="324" r="9.5" fill="#1B212B" stroke="#6E7A8A" stroke-width="0.9"/>
    <text x="74" y="328" font-size="10" font-weight="600" fill="#E8EDF4" text-anchor="middle">3</text>
    <text x="96" y="322" font-size="12.5" font-weight="600" fill="#E8EDF4">Exact quotations</text>
    <text x="96" y="340" font-size="11" fill="#A6B0BE">every quote occurs character for character in a cited entry</text>

    <circle cx="74" cy="380" r="9.5" fill="#1B212B" stroke="#6E7A8A" stroke-width="0.9"/>
    <text x="74" y="384" font-size="10" font-weight="600" fill="#E8EDF4" text-anchor="middle">4</text>
    <text x="96" y="378" font-size="12.5" font-weight="600" fill="#E8EDF4">Unchanged sources</text>
    <text x="96" y="396" font-size="11" fill="#A6B0BE">the records on disk still match the attempt’s source hash</text>

    <!-- decision -->
    <polygon points="330,460 396,490 330,520 264,490" fill="#1B212B" stroke="#6E7A8A" stroke-width="1"/>
    <text x="330" y="494" font-size="11" fill="#E8EDF4" text-anchor="middle">all four pass?</text>
    <text x="222" y="482" font-size="11" font-weight="600" fill="#E8EDF4" text-anchor="middle">pass</text>
    <text x="438" y="482" font-size="11" font-weight="600" fill="#E0996A" text-anchor="middle">fail</text>

    <!-- save and readback -->
    <rect x="40" y="552" width="280" height="44" rx="3" fill="#1B212B" stroke="#6E7A8A" stroke-width="1"/>
    <text x="180" y="578" font-size="12.5" font-weight="600" fill="#E8EDF4" text-anchor="middle">Saved by Pi, then read back from disk</text>
    <text x="192" y="622" font-size="11" font-weight="600" fill="#E8EDF4">pass</text>
    <text x="390" y="566" font-size="11" font-weight="600" fill="#E0996A" text-anchor="middle">fail</text>

    <!-- pass outcome -->
    <rect x="40" y="640" width="280" height="80" rx="3" fill="#1B212B" stroke="#6E7A8A" stroke-width="1"/>
    <text x="60" y="666" font-size="13" font-weight="600" fill="#E8EDF4">Checkpoint committed</text>
    <line x1="56" y1="679" x2="304" y2="679" stroke="#4B5768" stroke-width="0.75"/>
    <text x="60" y="702" font-size="11.5" fill="#E8EDF4">Requests continue.</text>

    <!-- fail outcome -->
    <rect x="340" y="640" width="280" height="138" rx="3" fill="#45301F" stroke="#E0996A" stroke-width="1"/>
    <text x="360" y="666" font-size="13" font-weight="600" fill="#E8EDF4">Checkpoint not committed</text>
    <line x1="356" y1="679" x2="604" y2="679" stroke="#6B4F38" stroke-width="0.75"/>
    <text x="360" y="702" font-size="11.5" fill="#E8EDF4">Requests stay paused across new input,</text>
    <text x="360" y="720" font-size="11.5" fill="#E8EDF4"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, &quot;DejaVu Sans Mono&quot;, Consolas, monospace" letter-spacing="0">/reload</tspan> and restarts.</text>
    <text x="360" y="742" font-size="11.5" fill="#E8EDF4">No unchecked summary is published.</text>
    <text x="360" y="764" font-size="11.5" fill="#E8EDF4">No other writer is substituted.</text>

    <!-- exits -->
    <text x="372" y="806" font-size="11" fill="#A6B0BE"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, &quot;DejaVu Sans Mono&quot;, Consolas, monospace" letter-spacing="0" fill="#E8EDF4">/compact</tspan>: retries; the pause ends only when</text>
    <text x="372" y="822" font-size="11" fill="#A6B0BE">a new checkpoint is committed</text>
    <text x="372" y="850" font-size="11" fill="#A6B0BE"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, &quot;DejaVu Sans Mono&quot;, Consolas, monospace" letter-spacing="0" fill="#E8EDF4">/compaction-recover</tspan>: confirms a checkpoint</text>
    <text x="372" y="866" font-size="11" fill="#A6B0BE">Pi already saved after it was staged</text>

    <!-- footnote -->
    <line x1="40" y1="898" x2="620" y2="898" stroke="#4B5768" stroke-width="0.75"/>
    <text x="40" y="918" font-size="11" fill="#A6B0BE">These checks establish reference consistency, not completeness.</text>
    <text x="40" y="936" font-size="11" fill="#A6B0BE">Sessions SLICE never protected and cannot check are left to Pi.</text>
  </g>
</svg>
