<svg xmlns="http://www.w3.org/2000/svg" width="660" height="690" viewBox="0 0 660 690" role="img" aria-labelledby="figd2title fig2desc">
  <title id="figd2title">The commit gate</title>
  <desc id="figd2desc">A draft handover note enters a commit gate with three checks: every source reference must belong to the selected session branch, every quotation must occur verbatim in the record it cites, and the note must be valid and the write must succeed. If all three pass, the checkpoint is published and the session continues. If any check fails, through a changed source, an invalid note or a failed write, the checkpoint is not published, further requests are blocked until an explicit retry or new user input, and no other writer is silently substituted.</desc>

  <defs>
    <marker id="arrow-d" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#6E7A8A"/>
    </marker>
    <marker id="arrow-accent-d" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#E0996A"/>
    </marker>
  </defs>

  <rect width="660" height="690" fill="#12161C"/>

  <g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, &quot;Liberation Sans&quot;, sans-serif" letter-spacing="0.01em">

    <!-- header -->
    <text x="40" y="36" font-size="17" font-weight="600" fill="#E8EDF4">The commit gate</text>
    <text x="40" y="58" font-size="11.5" fill="#A6B0BE">A checkpoint is published only if all three checks pass.</text>

    <!-- connectors -->
    <line x1="330" y1="142" x2="330" y2="178" stroke="#6E7A8A" stroke-width="0.9" marker-end="url(#arrow-d)"/>
    <line x1="330" y1="368" x2="330" y2="402" stroke="#6E7A8A" stroke-width="0.9" marker-end="url(#arrow-d)"/>
    <path d="M 264,434 L 180,434 L 180,498" fill="none" stroke="#6E7A8A" stroke-width="0.9" marker-end="url(#arrow-d)"/>
    <path d="M 396,434 L 480,434 L 480,498" fill="none" stroke="#E0996A" stroke-width="1" marker-end="url(#arrow-accent-d)"/>

    <!-- draft note -->
    <rect x="180" y="88" width="300" height="54" rx="3" fill="#232A35" stroke="#6E7A8A" stroke-width="1"/>
    <text x="330" y="112" font-size="13" font-weight="600" fill="#E8EDF4" text-anchor="middle">Draft handover note</text>
    <text x="330" y="130" font-size="11" fill="#A6B0BE" text-anchor="middle">a candidate, not yet published</text>

    <!-- gate region -->
    <rect x="40" y="180" width="580" height="188" rx="4" fill="none" stroke="#6E7A8A" stroke-width="1"/>
    <rect x="64" y="172" width="94" height="15" fill="#12161C"/>
    <text x="111" y="184" font-size="10.5" font-weight="600" letter-spacing="0.09em" fill="#A6B0BE" text-anchor="middle">COMMIT GATE</text>

    <circle cx="74" cy="212" r="9.5" fill="#1B212B" stroke="#6E7A8A" stroke-width="0.9"/>
    <text x="74" y="216" font-size="10" font-weight="600" fill="#E8EDF4" text-anchor="middle">a</text>
    <text x="96" y="210" font-size="12.5" font-weight="600" fill="#E8EDF4">Source references</text>
    <text x="96" y="228" font-size="11" fill="#A6B0BE">every reference must belong to the selected session branch</text>

    <circle cx="74" cy="268" r="9.5" fill="#1B212B" stroke="#6E7A8A" stroke-width="0.9"/>
    <text x="74" y="272" font-size="10" font-weight="600" fill="#E8EDF4" text-anchor="middle">b</text>
    <text x="96" y="266" font-size="12.5" font-weight="600" fill="#E8EDF4">Quotations</text>
    <text x="96" y="284" font-size="11" fill="#A6B0BE">every quotation must occur verbatim in the record it cites</text>

    <circle cx="74" cy="324" r="9.5" fill="#1B212B" stroke="#6E7A8A" stroke-width="0.9"/>
    <text x="74" y="328" font-size="10" font-weight="600" fill="#E8EDF4" text-anchor="middle">c</text>
    <text x="96" y="322" font-size="12.5" font-weight="600" fill="#E8EDF4">Note and write</text>
    <text x="96" y="340" font-size="11" fill="#A6B0BE">the note must be valid and the write must succeed</text>

    <!-- decision -->
    <polygon points="330,404 396,434 330,464 264,434" fill="#1B212B" stroke="#6E7A8A" stroke-width="1"/>
    <text x="330" y="438" font-size="11" fill="#E8EDF4" text-anchor="middle">all three pass?</text>

    <text x="222" y="426" font-size="11" font-weight="600" fill="#E8EDF4" text-anchor="middle">pass</text>
    <text x="438" y="426" font-size="11" font-weight="600" fill="#E0996A" text-anchor="middle">fail</text>

    <text x="494" y="452" font-size="10.5" fill="#A6B0BE">changed source,</text>
    <text x="494" y="468" font-size="10.5" fill="#A6B0BE">invalid note,</text>
    <text x="494" y="484" font-size="10.5" fill="#A6B0BE">failed write</text>

    <!-- pass outcome -->
    <rect x="40" y="500" width="280" height="116" rx="3" fill="#1B212B" stroke="#6E7A8A" stroke-width="1"/>
    <text x="60" y="526" font-size="13" font-weight="600" fill="#E8EDF4">Checkpoint published</text>
    <line x1="56" y1="539" x2="304" y2="539" stroke="#4B5768" stroke-width="0.75"/>
    <text x="60" y="562" font-size="11.5" fill="#E8EDF4">The session continues.</text>
    <text x="60" y="584" font-size="11.5" fill="#A6B0BE">The note becomes the checkpoint</text>
    <text x="60" y="602" font-size="11.5" fill="#A6B0BE">the active context resumes from.</text>

    <!-- fail outcome -->
    <rect x="340" y="500" width="280" height="116" rx="3" fill="#45301F" stroke="#E0996A" stroke-width="1"/>
    <text x="360" y="526" font-size="13" font-weight="600" fill="#E8EDF4">Checkpoint not published</text>
    <line x1="356" y1="539" x2="604" y2="539" stroke="#6B4F38" stroke-width="0.75"/>
    <text x="360" y="562" font-size="11.5" fill="#A6B0BE">Further requests are blocked until</text>
    <text x="360" y="580" font-size="11.5" fill="#A6B0BE">an explicit retry or new user input.</text>
    <text x="360" y="602" font-size="11.5" fill="#E8EDF4">No other writer is silently substituted.</text>

    <!-- footnote -->
    <line x1="40" y1="648" x2="620" y2="648" stroke="#4B5768" stroke-width="0.75"/>
    <text x="40" y="668" font-size="11" fill="#A6B0BE">The checks are structural: they establish reference consistency, not semantic completeness.</text>
  </g>
</svg>
