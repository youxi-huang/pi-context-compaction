<svg xmlns="http://www.w3.org/2000/svg" width="830" height="746" viewBox="0 0 830 746" role="img" aria-labelledby="herod-title herod-desc">
  <title id="herod-title">Continuity with a route back to the source</title>
  <desc id="herod-desc">Illustrative example. Left, the session record kept on disk: a column of entries from older to newer, with two highlighted: Port 9000 failed, and User decision: port 4318, timeout 9500. Between them sits 4317 approved as a replacement. Right, after a checkpoint, the source-linked handover note, labelled SLICE: Failure, port 9000, and Decision, port 4318, timeout 9500, each with an arrow back to the entry it cites. These lines cite the entries they came from; the citations are checked before commit. context_history lets the agent read them again, on the current session branch only. Below, a short handover, for comparison, might keep only the latest port: it keeps port 4318, while why the port changed could be lost and the 4317 approval could blur into the later decision, both shown in dashed outline. Footnote: checkpoints are written on /compact and when a completed turn reaches Pi’s threshold. The checks establish reference consistency, not completeness. Illustrative, after the README’s port scenario; not a screenshot of a run. Dashed outline: what a short handover could lose.</desc>

  <rect width="830" height="746" fill="#12161C"/>

  <g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, &quot;Liberation Sans&quot;, sans-serif">

    <!-- header -->
    <text x="48" y="70" font-size="21.75" font-weight="600" fill="#E8EDF4">Continuity with a route back to the source</text>
    <text x="782" y="70" font-size="11.75" font-weight="600" letter-spacing="0.08em" fill="#A6B0BE" text-anchor="end">ILLUSTRATIVE EXAMPLE</text>
    <text x="48" y="97" font-size="14.4" fill="#A6B0BE">The handover note cites the original entries; they stay on disk and can be read again.</text>
    <line x1="48" y1="118" x2="782" y2="118" stroke="#4B5768" stroke-width="0.75"/>

    <!-- column labels -->
    <text x="48" y="152" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#A6B0BE">SESSION RECORD, KEPT ON DISK</text>
    <text x="398" y="152" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#A6B0BE">AFTER A CHECKPOINT</text>

    <!-- session record -->
    <rect x="48" y="170" width="270" height="278" rx="3" fill="#1B212B" stroke="#6E7A8A" stroke-width="1"/>
    <g stroke="#4B5768" stroke-width="0.75">
      <line x1="48" y1="192" x2="318" y2="192"/>
      <line x1="48" y1="272" x2="318" y2="272"/>
      <line x1="48" y1="308" x2="318" y2="308"/>
      <line x1="48" y1="404" x2="318" y2="404"/>
      <line x1="48" y1="426" x2="318" y2="426"/>
    </g>
    <rect x="48" y="214" width="270" height="36" fill="#45301F" stroke="#E0996A" stroke-width="1.2"/>
    <rect x="48" y="330" width="270" height="52" fill="#45301F" stroke="#E0996A" stroke-width="1.2"/>
    <text x="62" y="185.5" font-size="12" fill="#A6B0BE">older</text>
    <text x="62" y="237" font-size="14.4" fill="#E8EDF4">Port 9000 failed</text>
    <text x="62" y="295" font-size="14.4" fill="#E8EDF4">4317 approved as a replacement</text>
    <text x="62" y="352" font-size="14.4" fill="#E8EDF4">User decision:</text>
    <text x="62" y="370" font-size="14.4" fill="#E8EDF4">port 4318, timeout 9500</text>
    <text x="62" y="441.5" font-size="12" fill="#A6B0BE">newer</text>

    <!-- citation arrows -->
    <line x1="398" y1="232" x2="326" y2="232" stroke="#E0996A" stroke-width="1.2"/>
    <polygon points="319.5,232 327.5,229 327.5,235" fill="#E0996A"/>
    <line x1="398" y1="356" x2="326" y2="356" stroke="#E0996A" stroke-width="1.2"/>
    <polygon points="319.5,356 327.5,353 327.5,359" fill="#E0996A"/>

    <!-- handover note card -->
    <rect x="398" y="170" width="384" height="278" rx="3" fill="#1B212B" stroke="#6E7A8A" stroke-width="1"/>
    <text x="418" y="196" font-size="15.75" font-weight="600" fill="#E8EDF4">Source-linked handover note</text>
    <text x="762" y="196" font-size="13.4" fill="#A6B0BE" text-anchor="end">SLICE</text>
    <line x1="418" y1="210" x2="762" y2="210" stroke="#4B5768" stroke-width="0.75"/>
    <text x="418" y="237" font-size="13.4" fill="#A6B0BE">Failure</text>
    <text x="514" y="237" font-size="14.4" fill="#E8EDF4">port 9000</text>
    <text x="418" y="290" font-size="13.4" fill="#A6B0BE">These lines cite the entries they came from;</text>
    <text x="418" y="308" font-size="13.4" fill="#A6B0BE">the citations are checked before commit.</text>
    <text x="418" y="361" font-size="13.4" fill="#A6B0BE">Decision</text>
    <text x="514" y="361" font-size="14.4" fill="#E8EDF4">port 4318, timeout 9500</text>
    <line x1="418" y1="394" x2="762" y2="394" stroke="#4B5768" stroke-width="0.75"/>
    <text x="418" y="418" font-size="13.4" fill="#A6B0BE"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, &quot;DejaVu Sans Mono&quot;, Consolas, monospace" font-size="12.9" fill="#E0996A">context_history</tspan> lets the agent read them again,</text>
    <text x="418" y="436" font-size="13.4" fill="#A6B0BE">on the current session branch only.</text>

    <!-- comparison panel -->
    <rect x="48" y="492" width="734" height="128" rx="3" fill="#232A35" stroke="#6E7A8A" stroke-width="1"/>
    <text x="68" y="518" font-size="15.75" font-weight="600" fill="#E8EDF4">A short handover, for comparison</text>
    <text x="762" y="518" font-size="13.4" fill="#A6B0BE" text-anchor="end">might keep only the latest port</text>
    <line x1="68" y1="532" x2="762" y2="532" stroke="#4B5768" stroke-width="0.75"/>
    <text x="68" y="569" font-size="13.4" fill="#A6B0BE">Kept</text>
    <text x="68" y="588" font-size="14.4" fill="#E8EDF4">port 4318</text>
    <rect x="198" y="548" width="272" height="52" rx="3" fill="#12161C" stroke="#6E7A8A" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="212" y="569" font-size="14.4" fill="#E8EDF4">Why the port changed</text>
    <text x="212" y="588" font-size="13.4" fill="#A6B0BE">could be lost</text>
    <rect x="490" y="548" width="272" height="52" rx="3" fill="#12161C" stroke="#6E7A8A" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="504" y="569" font-size="14.4" fill="#E8EDF4">The 4317 approval</text>
    <text x="504" y="588" font-size="13.4" fill="#A6B0BE">could blur into the later decision</text>

    <!-- footnote -->
    <line x1="48" y1="652" x2="782" y2="652" stroke="#4B5768" stroke-width="0.75"/>
    <text x="48" y="674" font-size="12.35" fill="#A6B0BE">Checkpoints are written on <tspan font-family="ui-monospace, SFMono-Regular, Menlo, &quot;DejaVu Sans Mono&quot;, Consolas, monospace">/compact</tspan> and when a completed turn reaches Pi’s threshold.</text>
    <text x="48" y="692" font-size="12.35" fill="#A6B0BE">The checks establish reference consistency, not completeness.</text>
    <text x="48" y="710" font-size="12.35" fill="#A6B0BE">Illustrative, after the README’s port scenario; not a screenshot of a run. Dashed outline: what a short handover could lose.</text>
  </g>
</svg>
