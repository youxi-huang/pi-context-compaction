<svg xmlns="http://www.w3.org/2000/svg" width="800" height="556" viewBox="0 0 800 556" role="img" aria-labelledby="fig3title fig3desc">
  <title id="fig3title">Recovery example: two retrievals, two points in time</title>
  <desc id="fig3desc">An illustrative timeline, not a run capture. Port 9000 is rejected after EADDRINUSE; port 4317 is the earlier approved replacement; a later user ruling sets port 4318 with timeout 9500; several compactions follow. The agent is then asked which port originally failed and what the user approved later. Two context_history retrievals reach back to two different points on the timeline, the original diagnostic and the later user ruling, and the answer gives both: original failure port 9000 with EADDRINUSE, current ruling port 4318 with timeout 9500, each citing its source entry.</desc>

  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#8C857A"/>
    </marker>
    <marker id="arrow-accent" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#8C5A3C"/>
    </marker>
  </defs>

  <rect width="800" height="556" fill="#FAFAF8"/>

  <g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, &quot;Liberation Sans&quot;, sans-serif" letter-spacing="0.01em">

    <!-- header -->
    <text x="40" y="36" font-size="17" font-weight="600" fill="#2E2620">Recovery example</text>
    <text x="760" y="36" font-size="10.5" font-weight="600" letter-spacing="0.09em" fill="#6B6259" text-anchor="end">ILLUSTRATIVE — NOT A RUN CAPTURE</text>
    <text x="40" y="58" font-size="11.5" fill="#6B6259">After several compactions, the latest port value alone cannot answer the question.</text>

    <!-- evidence cards -->
    <rect x="40" y="86" width="190" height="82" rx="3" fill="#FFFFFF" stroke="#8C857A" stroke-width="1"/>
    <text x="58" y="114" font-size="12.5" font-weight="600" fill="#2E2620">Port 9000 rejected</text>
    <text x="58" y="136" font-size="11.5" fill="#2E2620" font-family="ui-monospace, SFMono-Regular, Menlo, &quot;DejaVu Sans Mono&quot;, Consolas, monospace" letter-spacing="0">EADDRINUSE</text>
    <text x="58" y="154" font-size="11" fill="#6B6259">the original failure</text>

    <rect x="278" y="86" width="200" height="82" rx="3" fill="#FFFFFF" stroke="#8C857A" stroke-width="1"/>
    <text x="296" y="114" font-size="12.5" font-weight="600" fill="#2E2620">Port 4317 approved</text>
    <text x="296" y="136" font-size="11.5" fill="#6B6259">earlier approved replacement</text>
    <text x="296" y="154" font-size="11" fill="#6B6259">superseded by the later ruling</text>

    <rect x="526" y="86" width="234" height="82" rx="3" fill="#FFFFFF" stroke="#8C857A" stroke-width="1"/>
    <text x="544" y="114" font-size="12.5" font-weight="600" fill="#2E2620">User ruling: port 4318</text>
    <text x="544" y="136" font-size="11.5" fill="#2E2620">timeout 9500</text>
    <text x="544" y="154" font-size="11" fill="#6B6259">the later user ruling</text>

    <!-- stems -->
    <g stroke="#C9C4BB" stroke-width="0.75">
      <line x1="135" y1="168" x2="135" y2="191"/>
      <line x1="378" y1="168" x2="378" y2="191"/>
      <line x1="643" y1="168" x2="643" y2="191"/>
    </g>

    <!-- timeline axis -->
    <line x1="40" y1="196" x2="760" y2="196" stroke="#8C857A" stroke-width="0.9" marker-end="url(#arrow)"/>
    <g stroke="#8C857A" stroke-width="0.9">
      <line x1="686" y1="188" x2="686" y2="204"/>
      <line x1="710" y1="188" x2="710" y2="204"/>
      <line x1="734" y1="188" x2="734" y2="204"/>
    </g>
    <circle cx="135" cy="196" r="5.5" fill="#EFE7DA" stroke="#8C5A3C" stroke-width="1"/>
    <circle cx="378" cy="196" r="5.5" fill="#FFFFFF" stroke="#8C857A" stroke-width="1"/>
    <circle cx="643" cy="196" r="5.5" fill="#EFE7DA" stroke="#8C5A3C" stroke-width="1"/>
    <text x="40" y="222" font-size="10.5" fill="#6B6259">session time</text>
    <text x="760" y="222" font-size="10.5" fill="#6B6259" text-anchor="end">several compactions</text>

    <!-- retrieval arcs -->
    <path d="M 230,280 C 178,280 141,258 135,212" fill="none" stroke="#8C5A3C" stroke-width="1" marker-end="url(#arrow-accent)"/>
    <path d="M 570,280 C 618,280 638,258 643,212" fill="none" stroke="#8C5A3C" stroke-width="1" marker-end="url(#arrow-accent)"/>
    <text x="400" y="248" font-size="11" fill="#6B6259" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, &quot;DejaVu Sans Mono&quot;, Consolas, monospace" letter-spacing="0" fill="#2E2620">context_history</tspan> searches or reads this branch</text>

    <!-- question -->
    <rect x="230" y="262" width="340" height="84" rx="3" fill="#F4F1EA" stroke="#8C857A" stroke-width="1"/>
    <text x="400" y="286" font-size="10.5" font-weight="600" letter-spacing="0.09em" fill="#6B6259" text-anchor="middle">LATER, THE AGENT IS ASKED</text>
    <text x="400" y="310" font-size="12.5" font-style="italic" fill="#2E2620" text-anchor="middle">Which port originally failed, and</text>
    <text x="400" y="330" font-size="12.5" font-style="italic" fill="#2E2620" text-anchor="middle">what did the user approve later?</text>

    <line x1="400" y1="346" x2="400" y2="382" stroke="#8C857A" stroke-width="0.9" marker-end="url(#arrow)"/>

    <!-- answer -->
    <rect x="40" y="384" width="720" height="100" rx="3" fill="#FFFFFF" stroke="#8C857A" stroke-width="1"/>
    <text x="60" y="410" font-size="12.5" font-weight="600" fill="#2E2620">The agent answers from two separate retrievals</text>
    <line x1="56" y1="422" x2="744" y2="422" stroke="#C9C4BB" stroke-width="0.75"/>
    <line x1="400" y1="434" x2="400" y2="470" stroke="#C9C4BB" stroke-width="0.75"/>
    <text x="60" y="450" font-size="12.5" fill="#2E2620">Original failure: port 9000, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, &quot;DejaVu Sans Mono&quot;, Consolas, monospace" letter-spacing="0">EADDRINUSE</tspan></text>
    <text x="60" y="470" font-size="11" fill="#6B6259">read back from the diagnostic entry it cites</text>
    <text x="424" y="450" font-size="12.5" fill="#2E2620">Current ruling: port 4318, timeout 9500</text>
    <text x="424" y="470" font-size="11" fill="#6B6259">read back from the later user message it cites</text>

    <!-- footnote -->
    <line x1="40" y1="512" x2="760" y2="512" stroke="#C9C4BB" stroke-width="0.75"/>
    <text x="40" y="532" font-size="11" fill="#6B6259">Illustrative example, not a run capture. Values follow the documented provider scenario.</text>
  </g>
</svg>
