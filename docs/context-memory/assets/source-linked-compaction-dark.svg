<svg xmlns="http://www.w3.org/2000/svg" width="800" height="484" viewBox="0 0 800 484" role="img" aria-labelledby="figd1title fig1desc">
  <title id="figd1title">Source-linked compaction</title>
  <desc id="figd1desc">Two layers. On top, the active context after compaction: a handover note recording task state, next steps and references to original entries, published as the checkpoint, and the active context that resumes from it. Underneath, the session JSONL on disk, where every original entry is retained. An arrow up from the record shows that the session model writes the note at compaction. A pair of arrows between the layers shows the agent using context_history to search or read the original records on the current session branch and getting back original text with its source entry ID.</desc>

  <defs>
    <marker id="arrow-d" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#6E7A8A"/>
    </marker>
    <marker id="arrow-accent-d" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#E0996A"/>
    </marker>
  </defs>

  <rect width="800" height="484" fill="#12161C"/>

  <g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, &quot;Liberation Sans&quot;, sans-serif" letter-spacing="0.01em">

    <!-- header -->
    <text x="40" y="36" font-size="17" font-weight="600" fill="#E8EDF4">Source-linked compaction</text>
    <text x="40" y="58" font-size="11.5" fill="#A6B0BE">The active context is compacted. The session record is not.</text>

    <!-- zone label, upper layer -->
    <text x="40" y="90" font-size="10.5" font-weight="600" letter-spacing="0.09em" fill="#A6B0BE">ACTIVE CONTEXT AFTER COMPACTION</text>

    <!-- connectors (drawn before boxes) -->
    <line x1="392" y1="166" x2="440" y2="166" stroke="#6E7A8A" stroke-width="0.9" marker-end="url(#arrow-d)"/>
    <line x1="253" y1="320" x2="253" y2="232" stroke="#6E7A8A" stroke-width="0.9" marker-end="url(#arrow-d)"/>
    <line x1="640" y1="232" x2="640" y2="318" stroke="#E0996A" stroke-width="1" marker-end="url(#arrow-accent-d)"/>
    <line x1="547" y1="318" x2="547" y2="232" stroke="#E0996A" stroke-width="1" marker-end="url(#arrow-accent-d)"/>

    <!-- box N: handover note -->
    <rect x="40" y="102" width="352" height="128" rx="3" fill="#1B212B" stroke="#6E7A8A" stroke-width="1"/>
    <text x="60" y="126" font-size="13" font-weight="600" fill="#E8EDF4">Handover note</text>
    <text x="372" y="126" font-size="10.5" fill="#A6B0BE" text-anchor="end">published as the checkpoint</text>
    <line x1="56" y1="141" x2="376" y2="141" stroke="#4B5768" stroke-width="0.75"/>
    <rect x="60" y="158" width="4" height="4" fill="#6E7A8A"/>
    <text x="74" y="166" font-size="11.5" fill="#E8EDF4">Task state</text>
    <rect x="60" y="180" width="4" height="4" fill="#6E7A8A"/>
    <text x="74" y="188" font-size="11.5" fill="#E8EDF4">Next steps</text>
    <rect x="60" y="202" width="4" height="4" fill="#6E7A8A"/>
    <text x="74" y="210" font-size="11.5" fill="#E8EDF4">References to original entries</text>

    <!-- box C: active context -->
    <rect x="440" y="102" width="320" height="128" rx="3" fill="#1B212B" stroke="#6E7A8A" stroke-width="1"/>
    <text x="460" y="126" font-size="13" font-weight="600" fill="#E8EDF4">Active context</text>
    <text x="740" y="126" font-size="10.5" fill="#A6B0BE" text-anchor="end">what the model sees next</text>
    <line x1="456" y1="141" x2="744" y2="141" stroke="#4B5768" stroke-width="0.75"/>
    <text x="460" y="168" font-size="11.5" fill="#E8EDF4">Resumes from the checkpoint.</text>
    <text x="460" y="192" font-size="11.5" fill="#A6B0BE">Carries the note, not the transcript</text>
    <text x="460" y="210" font-size="11.5" fill="#A6B0BE">the note summarizes.</text>

    <!-- arrow label: resume -->
    <text x="416" y="156" font-size="10.5" fill="#A6B0BE" text-anchor="middle">resume</text>

    <!-- write-path label -->
    <text x="267" y="248" font-size="11" fill="#A6B0BE">at compaction, the session model</text>
    <text x="267" y="264" font-size="11" fill="#A6B0BE">writes the note</text>
    <text x="267" y="280" font-size="11" fill="#A6B0BE">(a fixed writer is optional)</text>

    <!-- retrieval labels -->
    <text x="652" y="250" font-size="10.5" fill="#E8EDF4" font-family="ui-monospace, SFMono-Regular, Menlo, &quot;DejaVu Sans Mono&quot;, Consolas, monospace" letter-spacing="0">context_history</text>
    <text x="652" y="266" font-size="10.5" fill="#A6B0BE">search or read on</text>
    <text x="652" y="282" font-size="10.5" fill="#A6B0BE">this session branch</text>
    <text x="535" y="258" font-size="10.5" fill="#A6B0BE" text-anchor="end">original text</text>
    <text x="535" y="274" font-size="10.5" fill="#A6B0BE" text-anchor="end">+ source entry ID</text>

    <!-- zone label, lower layer -->
    <text x="40" y="306" font-size="10.5" font-weight="600" letter-spacing="0.09em" fill="#A6B0BE">SESSION RECORD ON DISK</text>

    <!-- record band -->
    <rect x="40" y="320" width="720" height="104" rx="3" fill="#1B212B" stroke="#6E7A8A" stroke-width="1"/>
    <text x="60" y="344" font-size="13" font-weight="600" fill="#E8EDF4">Session JSONL</text>
    <text x="740" y="344" font-size="10.5" fill="#A6B0BE" text-anchor="end">every original entry is retained, in order</text>
    <line x1="40" y1="356" x2="760" y2="356" stroke="#6E7A8A" stroke-width="0.75"/>

    <!-- entry ribbon -->
    <rect x="64" y="372" width="672" height="26" rx="2" fill="#1B212B" stroke="#6E7A8A" stroke-width="1"/>
    <g stroke="#4B5768" stroke-width="0.75">
      <line x1="106" y1="372" x2="106" y2="398"/>
      <line x1="148" y1="372" x2="148" y2="398"/>
      <line x1="190" y1="372" x2="190" y2="398"/>
      <line x1="232" y1="372" x2="232" y2="398"/>
      <line x1="274" y1="372" x2="274" y2="398"/>
      <line x1="316" y1="372" x2="316" y2="398"/>
      <line x1="358" y1="372" x2="358" y2="398"/>
      <line x1="400" y1="372" x2="400" y2="398"/>
      <line x1="442" y1="372" x2="442" y2="398"/>
      <line x1="484" y1="372" x2="484" y2="398"/>
      <line x1="526" y1="372" x2="526" y2="398"/>
      <line x1="568" y1="372" x2="568" y2="398"/>
      <line x1="610" y1="372" x2="610" y2="398"/>
      <line x1="652" y1="372" x2="652" y2="398"/>
      <line x1="694" y1="372" x2="694" y2="398"/>
    </g>
    <rect x="232" y="372" width="42" height="26" fill="#45301F" stroke="#E0996A" stroke-width="1"/>
    <rect x="526" y="372" width="42" height="26" fill="#45301F" stroke="#E0996A" stroke-width="1"/>
    <text x="64" y="414" font-size="10.5" fill="#A6B0BE">older</text>
    <text x="736" y="414" font-size="10.5" fill="#A6B0BE" text-anchor="end">newer</text>
    <text x="400" y="414" font-size="10.5" fill="#E0996A" text-anchor="middle">shaded: original entries the note cites and the agent re-reads</text>

    <!-- footnote -->
    <line x1="40" y1="444" x2="760" y2="444" stroke="#4B5768" stroke-width="0.75"/>
    <text x="40" y="464" font-size="11" fill="#A6B0BE">Reference checks establish reference consistency, not semantic completeness.</text>
  </g>
</svg>
